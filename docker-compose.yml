version: '3.8'

services:
  immich-duplicate-finder:
    # 方式 A: 使用预构建镜像（推荐，无需克隆代码）
    image: ghcr.io/25283531/immich-duplicate-finder:latest
    # 方式 B: 本地构建（取消下面 build 注释，注释上面 image）
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    #     PIP_TRUSTED_HOST: pypi.tuna.tsinghua.edu.cn
    container_name: immich-duplicate-finder
    restart: unless-stopped
    ports:
      - "8503:8503"
    volumes:
      - ./data:/app/data
      # 如果需要访问 NAS 上的照片目录（用于删除源文件）
      # - /volume1/photo:/mnt/nas_photo:ro
      # - /volume1/photo2:/mnt/nas_photo2:ro
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8503/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
        reservations:
          memory: 512m
          cpus: '0.5'
