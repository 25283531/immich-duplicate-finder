version: '3.8'

services:
  immich-duplicate-finder:
    # 方式 A: 使用预构建镜像（推荐，无需克隆代码）
    image: ghcr.io/25283531/immich-duplicate-finder:latest
    # 方式 B: 本地构建（取消下面 build 注释，注释上面 image）
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    #     PIP_TRUSTED_HOST: pypi.tuna.tsinghua.edu.cn
    container_name: immich-duplicate-finder
    restart: unless-stopped
    ports:
      - "8503:8503"
    # 与 Immich 放在同一个网络，便于直接用服务名访问 Immich API
    # networks:
    #   - immich_default
    volumes:
      - ./data:/app/data

      # ============================================================
      # NAS 照片目录挂载（用于物理删除 NAS 磁盘上的源文件）
      # 原则：工具容器内的路径 = NAS 真实路径，与 UI 中填写的 nas_path 一致
      # ============================================================

      # 示例 1: 内部库原图目录（Immich 容器中 /data/library）
      # Immich:     /data/library           →  /share/照片视频/immich_photos
      # 工具容器:   /share/照片视频/immich_photos  →  /share/照片视频/immich_photos
      # UI 映射:    容器路径 /data/library  →  NAS 路径 /share/照片视频/immich_photos
      - /share/照片视频/immich_photos:/share/照片视频/immich_photos

      # 示例 2: 外部媒体库（Immich 容器中 /photos）
      # Immich:     /photos                 →  /share/照片视频
      # 工具容器:   /share/照片视频         →  /share/照片视频
      # UI 映射:    容器路径 /photos        →  NAS 路径 /share/照片视频
      - /share/照片视频:/share/照片视频

      # 示例 3: 缓存目录（Immich 容器中 /data）
      # 一般不需要挂载此目录；即使挂载，工具也默认不删除缓存文件
      # Immich:     /data                   →  /share/Container/immich/upload
      # UI 映射:    容器路径 /data          →  NAS 路径 /share/Container/immich/upload
      # - /share/Container/immich/upload:/share/Container/immich/upload

      # --- 其他常见挂载模板，请按需取消注释并修改 ---
      # - /volume1/photo:/volume1/photo
      # - /volume2/photo2:/volume2/photo2
      # - /share/Public/照片:/share/Public/照片

    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8503/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: '2.0'
        reservations:
          memory: 1g
          cpus: '0.5'

# 如需和 Immich 使用同一网络：
# networks:
#   immich_default:
#     external: true
