# Immich 重复文件查找工具 - Nginx 反向代理配置示例
# 
# 使用场景：当 Streamlit 运行在 8503 端口，需要通过 80/443 端口对外访问时使用
# 
# 部署位置：Nginx 服务器的 conf/conf.d/ 目录下
# 文件名：immich-duplicate-finder.conf

server {
    listen 80;
    server_name your-domain.com;  # 替换为你的域名或 NAS IP
    
    # 如果需要 HTTPS，请取消注释下面两行并配置证书
    # listen 443 ssl http2;
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;
    
    # 强制 HTTP 跳转到 HTTPS（可选）
    # if ($scheme != "https") {
    #     return 301 https://$host$request_uri;
    # }
    
    location / {
        # Streamlit 反向代理配置
        proxy_pass http://127.0.0.1:8503;
        
        # WebSocket 支持（Streamlit 需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 必要的请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置（Streamlit 长连接需要）
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        
        # 缓冲区设置
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        
        # 大文件支持（图片缩略图下载）
        client_max_body_size 100M;
    }
    
    # 静态资源缓存（可选）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:8503;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
